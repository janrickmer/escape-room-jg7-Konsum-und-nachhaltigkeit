<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Der Sneaker vor der Haustür · Konsum unter der Lupe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DER SNEAKER VOR DER HAUSTÜR — Escape Room
   Politik & Wirtschaft · Jg. 7 · Konsum unter der Lupe
   Helles Design · Grün-/Erdtöne · frisch & nachhaltig
   ============================================================ */

:root{
  --bg:           #f6faf2;
  --bg-soft:      #ecf3e4;
  --surface:      #ffffff;
  --surface-alt:  #f3f8ec;
  --ink:          #1e2a1f;
  --ink-soft:     #3d4f3f;
  --ink-mute:     #6a7a6c;
  --primary:      #3f7a4d;   /* frisches Blattgrün */
  --primary-dark: #2d5e3a;
  --primary-soft: #e2efde;
  --accent:       #b07a2a;   /* warmes Erdgold */
  --accent-bright:#c8923c;
  --accent-soft:  #f4ead4;
  --success:      #2f7d41;
  --success-bg:   #e7f3e9;
  --error:        #b1442f;
  --error-bg:     #f8eae6;
  --missed:       #b07a2a;
  --missed-bg:    #f5ecd6;
  --border:       rgba(30,42,31,0.12);
  --border-soft:  rgba(30,42,31,0.07);
  --shadow-sm:    0 1px 3px rgba(30,42,31,0.07), 0 1px 2px rgba(30,42,31,0.05);
  --shadow-md:    0 6px 24px rgba(30,42,31,0.10), 0 2px 6px rgba(30,42,31,0.06);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Menlo', 'Courier New', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse at 10% 8%, rgba(63,122,77,0.07) 0%, transparent 45%),
    radial-gradient(ellipse at 92% 92%, rgba(176,122,42,0.06) 0%, transparent 45%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
  pointer-events:none;
}

.app{ min-height:100vh; display:flex; flex-direction:column; }

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:12px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.topbar-brand{
  display:flex; align-items:center; gap:11px;
  font-family:var(--font-display); font-weight:600; font-size:15px;
  color:var(--primary); letter-spacing:0.01em;
}
.topbar-brand svg{ width:24px; height:24px; stroke:var(--primary); fill:none; }
.topbar-progress{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.seal{
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--ink-mute); transition:all .35s cubic-bezier(.4,0,.2,1);
}
.seal.library{
  width:11px; height:11px; border-radius:2px; border:1.5px solid var(--border);
  background:transparent;
}
.seal.library.active{ border-color:var(--primary); background:var(--primary); }
.seal.library.visited{ border-color:var(--accent); background:var(--accent); }
.seal.active{ border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.seal.solved{
  background:var(--accent); border-color:var(--accent); color:#fff;
  font-family:var(--font-display); font-weight:700; font-size:14px; transform:rotate(-3deg);
}

/* ---------- Layout ---------- */
.main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:52px 22px 64px; }
.screen{ width:100%; max-width:880px; animation:screenIn .55s cubic-bezier(.16,1,.3,1) both; }
@keyframes screenIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

.site-footer{
  text-align:center; font-size:11px; color:var(--ink-mute);
  padding:18px 12px 22px; border-top:1px solid var(--border-soft);
  font-family:var(--font-mono); letter-spacing:0.02em;
}

/* ---------- Typography ---------- */
h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; color:var(--ink); letter-spacing:-0.01em; }
.kicker{
  font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.18em;
  text-transform:uppercase; color:var(--accent); margin-bottom:14px;
  display:flex; align-items:center; gap:11px;
}
.kicker::before{ content:''; width:26px; height:1px; background:var(--accent); display:inline-block; }
.title-mega{ font-size:clamp(40px,7vw,68px); font-weight:600; line-height:1; margin-bottom:20px; letter-spacing:-0.025em; }
.title-mega em{ font-style:italic; font-weight:400; color:var(--primary); }
.lede{ font-family:var(--font-display); font-size:clamp(17px,2vw,21px); font-weight:400; line-height:1.5; color:var(--ink-soft); max-width:60ch; margin-bottom:28px; }
.section-title{ font-size:clamp(28px,4vw,40px); font-weight:600; margin-bottom:8px; }
p{ margin-bottom:14px; }
p.body-lg{ font-size:16.5px; line-height:1.7; }
.text-mute{ color:var(--ink-mute); }

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:8px; padding:30px 34px; margin-bottom:22px; box-shadow:var(--shadow-sm); position:relative;
}
.card-accent::before{
  content:''; position:absolute; left:0; top:22px; bottom:22px; width:3px;
  background:var(--accent); border-radius:0 2px 2px 0;
}
.briefing{ font-family:var(--font-display); font-style:italic; font-size:17px; line-height:1.7; color:var(--ink); padding-left:18px; }
.briefing .speaker{
  display:block; font-family:var(--font-mono); font-style:normal; font-size:10px; font-weight:600;
  letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border:none; border-radius:4px;
  font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:0.02em;
  cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); text-decoration:none;
}
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.btn-ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--border); }
.btn-ghost:hover{ border-color:var(--primary); }
.btn-arrow::after{ content:'\2192'; font-family:var(--font-mono); font-size:15px; }
.btn-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; align-items:center; }

/* ---------- Inputs ---------- */
.field-label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.text-input{
  width:100%; padding:12px 14px; background:var(--surface-alt); border:1.5px solid var(--border);
  border-radius:4px; color:var(--ink); font-family:var(--font-body); font-size:15px;
}
.text-input:focus{ outline:none; border-color:var(--primary); background:#fff; }
.input-error{ display:none; margin-top:14px; padding:10px 14px; background:var(--error-bg); border-left:3px solid var(--error); color:var(--ink); font-size:13px; border-radius:4px; }

/* ---------- Room header ---------- */
.room-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:18px; }
.room-number{ font-family:var(--font-display); font-size:46px; font-weight:600; color:var(--accent); line-height:0.9; }
.room-location{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mute); }
.room-name{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--ink); }

/* ---------- Library ---------- */
.library-banner{
  display:flex; gap:14px; align-items:flex-start; background:var(--primary-soft);
  border:1px solid rgba(63,122,77,0.22); border-radius:8px; padding:16px 18px; margin-bottom:26px;
}
.library-banner svg{ width:22px; height:22px; stroke:var(--primary); fill:none; flex-shrink:0; margin-top:2px; }
.library-banner .warn{ display:block; margin-top:6px; color:var(--primary-dark); font-weight:600; font-size:13.5px; }
.lib-section{ margin-bottom:22px; }
.lib-section-title{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--primary); margin-bottom:8px; }
.lib-bullets{ margin:8px 0 0 20px; }
.lib-bullets li{ margin-bottom:7px; }
.lib-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px; }
@media(max-width:600px){ .lib-grid{ grid-template-columns:1fr; } }
.lib-card{ background:var(--surface-alt); border:1px solid var(--border-soft); border-radius:6px; padding:14px 16px; }
.lib-card-sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
.lib-card-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:2px 0 5px; }
.lib-card-body{ font-size:13.5px; color:var(--ink-soft); }
.lib-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
.lib-table th,.lib-table td{ text-align:left; padding:9px 11px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
.lib-table th{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-mute); }
.lib-warning-bar{
  display:flex; gap:12px; align-items:center; background:var(--accent-soft);
  border:1px solid rgba(176,122,42,0.3); border-radius:8px; padding:14px 18px; margin:22px 0;
}
.lib-warning-bar svg{ width:22px; height:22px; stroke:var(--accent); fill:none; flex-shrink:0; }
.note-box{
  background:var(--surface-alt); border-left:3px solid var(--primary); border-radius:4px;
  padding:12px 16px; margin:14px 0; font-size:14.5px;
}
.note-box .note-label{
  display:block; font-family:var(--font-mono); font-size:10px; font-weight:600;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--primary); margin-bottom:5px;
}

/* ---------- Chart (Säulendiagramm in Akte 2) ---------- */
.chart-wrap{
  text-align:center; margin:18px 0;
  padding:20px 18px 14px;
  background:var(--surface-alt);
  border:1px solid var(--border-soft);
  border-radius:8px;
}
.chart-wrap svg{ max-width:520px; width:100%; height:auto; display:block; margin:0 auto; }
.chart-caption{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em;
  color:var(--ink-mute); margin-top:6px; line-height:1.45;
}
.pollutants-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;
}
@media(max-width:600px){ .pollutants-grid{ grid-template-columns:1fr; } }
.pollutant-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:6px;
  padding:11px 13px;
}
.pollutant-card .pc-name{
  font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--error); margin-bottom:4px;
}
.pollutant-card .pc-body{ font-size:13px; line-height:1.45; color:var(--ink-soft); }

/* ---------- Video embed (Akten 3 & 4) ---------- */
.video-wrap{
  position:relative; width:100%; padding-top:56.25%;
  border-radius:8px; overflow:hidden; box-shadow:var(--shadow-md);
  background:#000; margin:14px 0 10px;
}
.video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.fallback-line{
  display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  margin-top:14px; font-size:14px; color:var(--ink-soft);
}
.alt-banner{
  background:var(--accent-soft); border:1px solid rgba(176,122,42,0.3);
  border-radius:8px; padding:14px 18px; margin:0 0 22px;
}
.alt-banner p{ margin:0; font-size:14px; }

/* ---------- Puzzle: single choice ---------- */
.mc-question{ margin-bottom:24px; }
.mc-q-text{ font-weight:600; font-size:16px; margin-bottom:12px; }
.mc-option{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:13px 16px; margin-bottom:9px; background:var(--surface); border:1.5px solid var(--border);
  border-radius:6px; cursor:pointer; font-size:14.5px; line-height:1.5; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.mc-option:hover{ border-color:var(--primary); }
.mc-option .dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.mc-option.selected{ border-color:var(--primary); background:var(--primary-soft); }
.mc-option.selected .dot{ border-color:var(--primary); background:var(--primary); box-shadow:inset 0 0 0 3px var(--surface); }
.mc-option.correct{ border-color:var(--success); background:var(--success-bg); }
.mc-option.incorrect{ border-color:var(--error); background:var(--error-bg); }

/* ---------- Puzzle: cloze + matching dropdowns ---------- */
.cloze{ font-size:16px; line-height:2.2; }
.cloze select, .match-select{
  font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--primary);
  background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:5px; padding:4px 8px; margin:0 2px;
}
.cloze select.ok, .match-select.ok{ border-color:var(--success); background:var(--success-bg); color:var(--success); }
.cloze select.bad, .match-select.bad{ border-color:var(--error); background:var(--error-bg); color:var(--error); }
.match-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.match-left{ flex:1; min-width:200px; font-weight:600; font-size:15px; }
.match-left .lc-sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-mute); }

/* ---------- Puzzle: multi-select grid ---------- */
.multi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin:20px 0; }
@media(max-width:600px){ .multi-grid{ grid-template-columns:1fr; } }
.multi-card{
  display:flex; align-items:flex-start; gap:11px; padding:15px 16px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; line-height:1.45;
  text-align:left; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.multi-card:hover{ border-color:var(--primary); }
.multi-card .box{ width:18px; height:18px; border-radius:4px; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.multi-card.selected{ border-color:var(--primary); background:var(--primary-soft); }
.multi-card.selected .box{ border-color:var(--primary); background:var(--primary); }
.multi-card.correct{ border-color:var(--success); background:var(--success-bg); }
.multi-card.incorrect{ border-color:var(--error); background:var(--error-bg); }
.multi-card.missed{ border-color:var(--missed); background:var(--missed-bg); }

/* ---------- Puzzle: classify rows (multi-column) ---------- */
.classify-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.classify-text{ flex:1; min-width:210px; font-size:14.5px; }
.classify-btns{ display:flex; gap:8px; flex-wrap:wrap; }
.classify-btn{
  font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:5px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .18s ease;
}
.classify-btn:hover{ border-color:var(--primary); }
.classify-btn.active{ border-color:var(--primary); background:var(--primary); color:#fff; }
.classify-row.correct{ background:var(--success-bg); }
.classify-row.incorrect{ background:var(--error-bg); }

/* ---------- Status / hint ---------- */
.status{ padding:14px 18px; border-radius:6px; margin:18px 0; font-size:14px; display:none; }
.status.show{ display:block; animation:screenIn .3s ease both; }
.status .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:4px; }
.status-success{ background:var(--success-bg); border-left:3px solid var(--success); }
.status-success .label{ color:var(--success); }
.status-warning{ background:var(--error-bg); border-left:3px solid var(--error); }
.status-warning .label{ color:var(--error); }
.hint-box{ display:none; background:var(--surface-alt); border:1px dashed var(--border); border-radius:6px; padding:14px 18px; margin-top:16px; font-size:14px; color:var(--ink-soft); }
.hint-box.show{ display:block; }
.hint-box .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.hint-btn{ background:none; border:none; color:var(--primary); font-family:var(--font-body); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; }

/* ---------- Reveal overlay ---------- */
.reveal-overlay{ position:fixed; inset:0; z-index:200; background:rgba(45,94,58,0.55); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; }
.reveal-overlay.show{ display:flex; animation:screenIn .3s ease both; }
.reveal-card{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow-md); padding:40px 44px; max-width:440px; text-align:center; }
.reveal-letter{ font-family:var(--font-display); font-size:96px; font-weight:700; color:var(--accent); line-height:1; }
.reveal-caption{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-mute); margin-top:6px; }
.reveal-progress{ display:flex; gap:8px; justify-content:center; margin:22px 0 26px; }
.reveal-progress-letter{ width:38px; height:46px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink-mute); background:var(--surface-alt); border:1px solid var(--border); border-radius:5px; }
.reveal-progress-letter.lit{ color:#fff; background:var(--accent); border-color:var(--accent); }

/* ---------- Final ---------- */
.final-hero{ text-align:center; margin-bottom:34px; }
.final-code{ font-family:var(--font-display); font-size:clamp(54px,12vw,104px); font-weight:700; letter-spacing:0.08em; color:var(--accent); line-height:1; }
.final-actions{ display:grid; gap:14px; }
.final-action{ display:block; width:100%; text-align:left; background:var(--surface-alt); border:1.5px solid var(--border); border-radius:8px; padding:18px 20px; cursor:pointer; transition:all .2s ease; font-family:var(--font-body); }
.final-action:hover{ border-color:var(--primary); box-shadow:var(--shadow-sm); }
.final-action .label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:600; }
.final-action .title{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--ink); margin:3px 0 4px; }
.final-action .desc{ font-size:13.5px; color:var(--ink-soft); }

/* ---- Übersichts-Download: eindeutig ein Button ---- */
.btn-download{ display:inline-flex; align-items:center; gap:10px; background:var(--primary); color:#fff; border:none; border-radius:10px; padding:14px 22px; font-family:var(--font-body); font-size:15.5px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(63,122,77,.35); transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn-download:hover{ background:#356a43; transform:translateY(-1px); box-shadow:0 6px 18px rgba(63,122,77,.45); }
.btn-download:active{ transform:translateY(0); }
.btn-download svg{ width:20px; height:20px; flex:none; }

/* ---- Arena: das große Finale gegen den Feiditor (dunkel, dramatisch) ---- */
.arena{ background:radial-gradient(120% 90% at 50% 0%, #17223a 0%, #0b1220 55%, #070c16 100%); color:#e9eef7; border-radius:14px; padding:34px 28px 30px; margin-top:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.06); }
.arena-kicker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#d6b25e; font-weight:600; text-align:center; }
.arena h2{ font-family:var(--font-display); font-size:30px; font-weight:700; color:#fff; text-align:center; margin:8px 0 10px; letter-spacing:.01em; }

.arena-foot{ text-align:center; font-size:12.5px; color:#7f8cab; margin-top:16px; }

.font-mono{ font-family:var(--font-mono); }
.muted-list{ margin:6px 0 0 18px; }
.muted-list li{ margin-bottom:6px; color:var(--ink-soft); font-size:14px; }

.journey-wrap svg{ max-width:520px; width:100%; height:auto; }

.lina-frame{ width:128px; flex-shrink:0; }
.lina-frame svg{ width:128px; height:160px; display:block; }
.lina-cap{ text-align:center; font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; color:var(--ink-mute); margin-top:6px; }
.lina-body{ flex:1; min-width:240px; }
.lina-body h3{ font-size:20px; margin-bottom:6px; }

<script type="text/template" id="feiditor-src">
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feiditor</title>
<style>
  :root{
    --paper:#f7f4ec; --paper2:#fffdf8; --ink:#221f1a; --muted:#6f675a;
    --line:#ddd5c4; --accent:#6b4f2c; --accent2:#8a6a3c; --shadow:rgba(40,30,15,.10);
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .screen{display:none; min-height:100vh}
  .screen.active{display:block}

  /* ---------- Start ---------- */
  #screen-start{display:none; place-items:center; padding:40px 20px}
  #screen-start.active{display:grid}
  .card{
    width:100%; max-width:440px; background:var(--paper2);
    border:1px solid var(--line); border-radius:14px; padding:40px 36px;
    box-shadow:0 18px 50px -28px var(--shadow);
  }
  .brand{font-family:var(--serif); font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0 0 6px}
  .card h1{font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px; letter-spacing:.01em}
  .card p.sub{color:var(--muted); margin:0 0 26px; font-size:14.5px}
  label{display:block; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .field{margin-bottom:18px}
  input[type=text]{
    width:100%; font-family:var(--serif); font-size:18px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600; letter-spacing:.01em;
    color:var(--paper2); background:var(--ink); border:1px solid var(--ink);
    border-radius:9px; padding:12px 18px; cursor:pointer; transition:transform .06s, background .15s;
  }
  .btn:hover{background:#332e25}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%; margin-top:6px}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.ghost:hover{background:var(--paper)}
  .err{color:#b3261e; font-size:13.5px; min-height:18px; margin:2px 0 0}
  .foot{margin-top:24px; padding-top:16px; border-top:1px solid var(--line); text-align:center}
  .foot a{color:var(--muted); font-size:12.5px; text-decoration:none; letter-spacing:.04em}
  .foot a:hover{color:var(--accent); text-decoration:underline}

  /* ---------- Editor ---------- */
  #screen-editor{display:none; flex-direction:column; height:100vh}
  #screen-editor.active{display:flex}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:13px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .who{font-family:var(--serif); font-size:16px}
  .who .lbl{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-right:8px}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .paperwrap{flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:34px 20px 150px}
  .sheet{
    width:100%; max-width:760px; background:var(--paper2); border:1px solid var(--line);
    border-radius:6px; box-shadow:0 24px 60px -40px var(--shadow); padding:56px 60px;
  }
  #editor{
    width:100%; min-height:60vh; border:0; outline:0; background:transparent;
    font-family:var(--serif); font-size:18.5px; line-height:1.78; color:var(--ink);
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  #editor:focus{outline:0}
  #editor .heading{font-weight:700; font-size:2em; line-height:1.25; margin:.1em 0}
  #editor.empty::before{content:attr(data-placeholder); color:#b9b0a0; pointer-events:none}

  /* ---------- Formatierungsleiste (Word-artig) ---------- */
  .formatbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .fbtn{
    font-family:var(--sans); font-size:15px; min-width:38px; height:34px; padding:0 11px;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:background .12s, border-color .12s, color .12s; user-select:none;
  }
  .fbtn:hover{background:#efe9dd}
  .fbtn:active{transform:translateY(1px)}
  .fbtn.active{background:var(--accent); color:var(--paper2); border-color:var(--accent)}
  .fbtn.wide{font-size:13.5px; letter-spacing:.02em}
  .fbtn .b{font-weight:800}
  .fbtn .i{font-style:italic}
  .fbtn .u{text-decoration:underline}
  .fsep{width:1px; height:22px; background:var(--line); margin:0 3px}
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:16px 16px 46px; background:linear-gradient(to top, var(--paper) 60%, rgba(247,244,236,0));
  }
  .copyright{
    position:fixed; left:0; right:0; bottom:13px; text-align:center;
    font-size:11px; letter-spacing:.05em; color:var(--muted); pointer-events:none; z-index:6;
  }

  /* ---------- Lehrkraft ---------- */
  #screen-teacher{display:none; place-items:start center; padding:40px 20px 80px}
  #screen-teacher.active{display:grid}
  .panel{width:100%; max-width:920px}
  .panel h1{font-family:var(--serif); font-weight:600; font-size:26px; margin:0 0 4px}
  .panel .sub{color:var(--muted); margin:0 0 22px; font-size:14.5px}
  .drop{
    background:var(--paper2); border:1.5px dashed var(--line); border-radius:12px;
    padding:26px; text-align:center; color:var(--muted); font-size:14.5px;
  }
  .drop strong{color:var(--ink)}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px}
  input[type=password]{
    font-family:var(--serif); font-size:18px; letter-spacing:.12em; width:180px;
    background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none;
  }
  input[type=password]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .hidden{display:none !important}
  .backlink{display:inline-block; margin-bottom:18px; color:var(--muted); font-size:13px; text-decoration:none}
  .backlink:hover{color:var(--accent)}

  /* analysis */
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin:20px 0 14px; font-size:13.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .sw{width:13px; height:13px; border-radius:3px; display:inline-block}
  .stat{font-size:13px; color:var(--muted); margin:0 0 16px; font-variant-numeric:tabular-nums}
  .analysis{
    background:var(--paper2); border:1px solid var(--line); border-radius:10px;
    padding:30px 34px; font-family:var(--serif); font-size:17.5px; line-height:1.85;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .nmeta{font-family:var(--sans); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px}
  .redbadge{
    display:inline-block; font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.02em;
    background:var(--paper2); border:1px solid var(--line); border-radius:9px; padding:8px 14px;
    margin:0 0 6px; font-variant-numeric:tabular-nums;
  }
  .redbadge.high{color:#b3261e; border-color:#b3261e; font-weight:800}
  .codefor{font-size:13.5px; color:var(--muted); margin:14px 0 0}

  /* Tabellenansicht (Mehrfach-Upload) */
  .batchsum{font-size:13px; color:var(--muted); margin:18px 0 10px; font-variant-numeric:tabular-nums}
  .tablewrap{border:1px solid var(--line); border-radius:10px; overflow:auto; background:var(--paper2)}
  table.batch{width:100%; border-collapse:collapse; font-size:15px}
  table.batch th{
    font-family:var(--sans); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--paper);
  }
  table.batch td{padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--serif); font-variant-numeric:tabular-nums}
  table.batch tr:last-child td{border-bottom:0}
  table.batch tr.clickable{cursor:pointer}
  table.batch tr.clickable:hover td, table.batch tr.selected td{background:#efe9dd}
  table.batch th.pct, table.batch td.pct{text-align:right; white-space:nowrap}
  table.batch td.pct.high{color:#b3261e; font-weight:800}
  table.batch tr.errrow td{color:var(--muted); font-style:italic; font-family:var(--sans); font-size:13.5px}
  .batchhint{font-size:12.5px; color:var(--muted); margin:10px 0 0}

  /* Rote Felder (Escape-Room-Modus, identisch zum eingebetteten Feiditor) */
  .moodle-hints{max-width:760px; margin:0 auto}
  .moodle-hint{
    max-width:760px; margin:14px auto 0; padding:14px 20px;
    background:#fdecea; border:1.5px solid #f5b8b1; border-radius:8px;
    color:#a72020; font-family:var(--sans); font-size:14.5px; font-weight:600;
    text-align:center; line-height:1.5;
    user-select:none;
  }
  /* Escape-Upload-Bereich auf der Anmeldeseite */
  .esc-upload{margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
  .esc-upload .sub{color:var(--muted); font-size:13.5px; margin:0 0 12px}
  .esc-upload .drop{padding:18px}
</style>
</head>

<!-- ============ START ============ -->
<section id="screen-start" class="screen active">
  <div class="card">
    <p class="brand">Feiditor</p>

      <div class="drop" id="esc-drop">
        <p style="margin:0 0 10px"><strong>Überblick-PDF auswählen</strong> oder hierher ziehen</p>

      </div>
      <p class="err" id="esc-err"></p>
    </div>

    <div class="foot"><a href="#" id="to-teacher">Lehrkraft</a></div>
  </div>
</section>

<!-- ============ EDITOR ============ -->
<section id="screen-editor" class="screen">
  <div class="topbar">
    <div class="who"><span class="lbl">Verfasser:in</span><span id="who-name"></span></div>
    <div class="count"><span id="charcount">0</span> Zeichen</div>

  </div>

  <div class="actionbar">
    <button class="btn" id="export-btn">Text in PDF-Datei umwandeln</button>
  </div>
</section>

<section id="screen-teacher" class="screen">
  <div class="panel">
    <a href="#" class="backlink" id="back-start">← zurück</a>
    <h1>Auswertung für die Lehrkraft</h1>
    <p class="sub">Laden Sie die PDF-Datei einer Schülerin bzw. eines Schülers und geben Sie den Code ein, um die Schreib-Auswertung anzuzeigen – oder wählen Sie mehrere PDFs auf einmal aus, um eine Übersichtstabelle der Rot-Anteile zu erhalten.</p>

    <div class="drop" id="teacher-drop">
      <p style="margin:0 0 10px"><strong>PDF-Datei(en) auswählen</strong> oder hierher ziehen</p>
      <input type="file" id="pdf-input" accept="application/pdf,.pdf" multiple>
    </div>
    <p class="err" id="teacher-err"></p>

    <div id="code-area" class="hidden">
      <p class="codefor hidden" id="code-for"></p>
      <div class="row">
        <input type="password" id="code-input" inputmode="numeric" placeholder="Code">
        <button class="btn" id="code-btn">Auswertung anzeigen</button>
      </div>
    </div>

    <div id="result"></div>
  </div>
</section>

<div id="pagefoot" class="copyright">Copyright Jan-Rickmer Feindt</div>

    const w=chW(c.ch,c.b,size);

        const head=cur.slice(0,lastSpace);

      } else { lines.push(cur); cur=[]; curW=0; lastSpace=-1; }
    }
    cur.push(c); curW+=w;
    if(c.ch===" ") lastSpace=cur.length-1;

function lineToRuns(lineChars){
  const runs=[];

    const last=runs[runs.length-1];
    if(last && last.b===c.b && last.i===c.i && last.u===c.u) last.text+=c.ch;
    else runs.push({text:c.ch,b:c.b,i:c.i,u:c.u});
  }
  return runs;
}

function fmtDateTime(d){
  if(!d) d=new Date();
  const date=d.toLocaleDateString('de-DE');

/* ============================================================
   ÜBERSICHTS-SEITEN (aus dem Escape-Room übergeben) — werden als
   zusätzliche Seiten hinter den Aufgaben-Seiten in die PDF gehängt.
   Liefert Content-Streams (nutzt /F1 = Helvetica, /F2 = Helvetica-Bold,
   die der Feiditor-Writer ebenfalls definiert).
   ============================================================ */
function buildOverviewPages(ov){
  const doc=new PdfDoc();
  const W=doc.pageW,H=doc.pageH,M=doc.margin; const CW=W-2*M;
  const PRIMARY=[63,122,77], ACCENT=[176,122,42], RED=[177,68,47], GREEN=[47,125,65], MUTE=[106,122,108], TEXT=[30,42,31];
  const attempts=Array.isArray(ov.attempts)?ov.attempts:[];
  const mistakes=Array.isArray(ov.mistakes)?ov.mistakes:[];
  const roomLabels=Array.isArray(ov.roomLabels)?ov.roomLabels:[];
  const notes=Array.isArray(ov.solutionNotes)?ov.solutionNotes:[];
  const subtitle=ov.subtitle||'';

  function header(title){
    doc.startPage();
    doc.rect(0,H-72,W,72,PRIMARY);
    doc.text(title,M,H-38,18,true,[255,255,255]);
    if(subtitle) doc.text(subtitle,M,H-58,9,false,[225,238,225]);
    return H-72-22;
  }
  function ensure(y,need){ if(y-need<70){ doc.endPage(); return header('Überblick deiner Antworten & Erläuterungen'); } return y; }

  let y=header('Überblick deiner Antworten & Erläuterungen');

  // Pflichthinweis (fett, ganz oben)
  doc.rect(M,y-44,CW,44,[244,234,212]);
  doc.rect(M,y-44,3,44,ACCENT);
  doc.paragraph('Diese Datei musst du bei Moodle in der dafür vorgesehenen Abgabe hochladen, um deinem Lehrer nachzuweisen, dass du den Escape-Room erfolgreich absolviert hast.',
    M+12,y-16,CW-24,10.5,true,PRIMARY,13.5);
  y-=44+14;

  // Identifikationsblock
  const blockH=78;
  doc.rect(M,y-blockH,CW,blockH,[243,248,236]);
  doc.rect(M,y-blockH,3,blockH,ACCENT);
  doc.text('NAME',M+14,y-16,8,true,ACCENT);
  doc.text((ov.firstName||'')+' '+(ov.lastName||''),M+14,y-31,13,true,PRIMARY);
  doc.text('GEBURTSDATUM',M+14,y-49,8,true,ACCENT);
  doc.text(ov.birthDate||'',M+14,y-63,11,false,TEXT);
  doc.text('BESTÄTIGUNGSCODE',M+300,y-16,8,true,ACCENT);
  doc.text(String(ov.code||''),M+300,y-31,13,true,PRIMARY);
  doc.text('ABGESCHLOSSEN AM',M+300,y-49,8,true,ACCENT);
  doc.text(ov.completedAt||'',M+300,y-63,11,false,TEXT);
  y-=blockH+18;

  y=doc.paragraph('Diese Seiten zeigen dir, was du beim ersten Versuch in jeder Etappe geantwortet hast. Jede Etappe hast du am Ende richtig gelöst – diese Übersicht soll dir nur helfen zu sehen, wo du anfangs noch danebenlagst. Danach findest du ausführliche Lösungserläuterungen zum Nachlesen.',
    M,y,CW,10.5,false,TEXT,14);
  y-=8;

  const totalErrors=mistakes.reduce((a,m)=>a+(m&&m.errors?m.errors.length:0),0);
  const perfectRooms=attempts.filter((a,i)=>a>=1 && (!mistakes[i]||!mistakes[i].errors||mistakes[i].errors.length===0)).length;
  doc.rect(M,y-34,CW,34,[231,243,233]);
  doc.rect(M,y-34,3,34,GREEN);
  doc.text('ÜBERSICHT',M+14,y-13,8,true,GREEN);
  doc.text(`Etappen im ersten Versuch fehlerfrei: ${perfectRooms} von ${roomLabels.length||6}   ·   Fehler im ersten Versuch insgesamt: ${totalErrors}`,M+14,y-26,10.5,true,TEXT);
  y-=48;

  for(let i=0;i<roomLabels.length;i++){
    y=ensure(y,64);
    doc.text(roomLabels[i],M,y,12.5,true,PRIMARY);
    doc.line(M,y-4,M+CW,y-4,ACCENT,0.8);
    y-=18;
    const att=attempts[i]; const m=mistakes[i];
    const attemptsLabel=att===1?'1 Versuch':att+' Versuche';
    if(!m||!m.errors||m.errors.length===0){
      y=doc.paragraph('Fehlerfrei beim ersten Versuch gelöst. ('+attemptsLabel+')',M,y,CW,10.5,true,GREEN,14); y-=8; continue;
    }
    y=doc.paragraph('Benötigt: '+attemptsLabel+'. Beim ersten Versuch war Folgendes nicht korrekt:',M,y,CW,10.5,false,MUTE,14); y-=4;
    for(const err of m.errors){
      y=ensure(y,52);
      doc.text('•',M,y,11,true,RED);
      if(err.kind==='mc_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Wahl: '+err.wrongAnswer,M+14,y,CW-14,10,false,RED,13);
        y=doc.paragraph('Richtig: '+err.correctAnswer,M+14,y,CW-14,10,true,GREEN,13);
      } else if(err.kind==='luecke_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Wahl: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='zuordnung_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Du zugeordnet: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsch_gewaehlt'){
        y=doc.paragraph('Falsch ausgewählt: "'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        if(err.explanation) y=doc.paragraph('→ '+err.explanation,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='uebersehen'){
        y=doc.paragraph('Übersehen (gehörte dazu): "'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        if(err.explanation) y=doc.paragraph('→ '+err.explanation,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsch_einsortiert'){
        y=doc.paragraph('"'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Du einsortiert: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsche_eingabe'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Eingabe: "'+err.wrongAnswer+'"   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      }
      y-=5;
    }
    y-=10;
  }

  y=ensure(y,40);
  doc.line(M,y,M+CW,y,[200,200,200],0.4); y-=14;
  doc.text('Bestätigungscode für Moodle: '+String(ov.code||''),M,y,10,true,PRIMARY);
  y-=22;
  doc.text('Copyright Jan-Rickmer Feindt',M,y,8.5,false,MUTE);
  doc.endPage();

  /* ---- Lösungserläuterungen ---- */
  if(notes.length){
    let y2=header('Lösungserläuterungen');
    y2=doc.paragraph('Hier werden die richtigen Lösungen der sechs Etappen noch einmal genauer erklärt. Lies sie in Ruhe durch – so kannst du das Wissen aus dem Escape-Room für die Reflexions-Aufgaben und im Unterricht nutzen.',M,y2,CW,10.5,false,TEXT,14);

    function ensure2(y,need){ if(y-need<70){ doc.endPage(); return header('Lösungserläuterungen'); } return y; }
    for(const note of notes){
      y2=ensure2(y2,90);
      doc.text(note.room,M,y2,12.5,true,PRIMARY);
      doc.line(M,y2-4,M+CW,y2-4,ACCENT,0.8);
      y2-=18;
      y2=doc.paragraph(note.text,M,y2,CW,10.5,false,TEXT,14.5);
      y2-=14;
    }
    y2=ensure2(y2,30);
    doc.line(M,y2,M+CW,y2,[200,200,200],0.4); y2-=14;
    doc.text('Copyright Jan-Rickmer Feindt',M,y2,8.5,false,MUTE);
    doc.endPage();
  }
  return doc.pages.map(p=>p.content);
}

function buildPdf(opts){
  const PW=595.28,PH=841.89, ML=56,MR=56,MT=56,MB=64;
  const HEAD_SIZE=13, BODY_SIZE=11, HEAD2_SIZE=22, NOTE_SIZE=11;
  const BODY_LEAD=15.5, HEAD_LEAD=28;
  const usableW=PW-ML-MR;
  const headerBaseline=PH-MT-HEAD_SIZE, ruleY=headerBaseline-6, bodyTop=ruleY-22, bodyBottom=MB+24;

  const text=opts.text||""; const fmt=opts.fmt||[];
  // in Absätze an '\n' teilen
  const paras=[]; { let cur=[]; for(let i=0;i<text.length;i++){ const ch=text[i]; if(ch==="\n"){paras.push(cur);cur=[];} else { const ft=fmt[i]||{}; cur.push({ch,b:!!ft.b,i:!!ft.i,u:!!ft.u,h:!!ft.h}); } } paras.push(cur); }

  // Anzeigezeilen mit Größe/Durchschuss
  const dispLines=[];
  for(const para of paras){
    const heading=para.length?para[0].h:false;
    const size=heading?HEAD2_SIZE:BODY_SIZE;
    const lead=heading?HEAD_LEAD:BODY_LEAD;
    if(para.length===0){ dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD}); continue; }
    const wrapped=wrapPara(para,size,usableW);
    for(const wl of wrapped) dispLines.push({runs:lineToRuns(wl),size,lead});
  }
  if(dispLines.length===0) dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD});

  // Seiten füllen
  const pages=[]; let idx=0;
  while(idx<dispLines.length){
    const pageLines=[]; let y=bodyTop;
    while(idx<dispLines.length && y>=bodyBottom){ const dl=dispLines[idx]; pageLines.push({dl,y}); y-=dl.lead; idx++; }
    if(pageLines.length===0){ pageLines.push({dl:dispLines[idx],y:bodyTop}); idx++; }
    pages.push({lines:pageLines});
  }
  const nPages=pages.length;
  // Übersichts-Seiten (aus dem Escape-Room) werden hinter die Aufgaben-Seiten gehängt
  const ovStreams=(opts.overview&&typeof buildOverviewPages==="function")?buildOverviewPages(opts.overview):[];
  const nAll=nPages+ovStreams.length;

  const noteText="Bitte diese PDF-Datei herunterladen und bei Moodle hochladen.";
  const noteLines=[]; { // Hinweis ist immer normal/unformatiert
    const arr=noteText.split("").map(ch=>({ch,b:false,i:false,u:false}));
    for(const wl of wrapPara(arr,NOTE_SIZE,usableW)) noteLines.push(lineToRuns(wl));
  }
  const noteBottom=46;

  const pageObjNum=(i)=>7+i*2, contObjNum=(i)=>8+i*2;
  const objects={};
  objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objects[2]=`<< /Type /Pages /Count ${nAll} /Kids [${Array.from({length:nAll},(_,i)=>`${pageObjNum(i)} 0 R`).join(" ")}] >>`;
  objects[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objects[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
  objects[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>";

  for(let i=0;i<nPages;i++){
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    let s="0.5 w\n";
    // Name + Linie
    s+=`BT /F1 ${HEAD_SIZE} Tf 0 0 0 rg ${ML} ${headerBaseline.toFixed(2)} Td (${encStr(opts.name||"")}) Tj ET\n`;
    s+=`${ML} ${ruleY.toFixed(2)} m ${(PW-MR).toFixed(2)} ${ruleY.toFixed(2)} l S\n`;
    // Textzeilen
    const underlines=[];
    for(const pl of pages[i].lines){
      const dl=pl.dl, y=pl.y;
      if(dl.runs.length){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${y.toFixed(2)} Tm 0 0 0 rg\n`;
        let x=ML;
        for(const run of dl.runs){
          const fn=fontFor(run.b,run.i);
          s+=`/${fn} ${dl.size} Tf (${encStr(run.text)}) Tj\n`;
          const rw=runWidth(run.text,run.b,dl.size);
          if(run.u){ underlines.push({x1:x,x2:x+rw,y:y-dl.size*0.12,lw:Math.max(0.5,dl.size*0.06)}); }
          x+=rw;
        }
        s+="ET\n";
      }
    }
    for(const ul of underlines){
      s+=`${ul.lw.toFixed(2)} w 0 0 0 RG ${ul.x1.toFixed(2)} ${ul.y.toFixed(2)} m ${ul.x2.toFixed(2)} ${ul.y.toFixed(2)} l S\n`;
    }
    // roter Hinweis nur auf der letzten Seite
    if(i===nPages-1){
      let yy=noteBottom+(noteLines.length-1)*BODY_LEAD;
      for(const runs of noteLines){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${yy.toFixed(2)} Tm 0.78 0.05 0.05 rg\n`;
        for(const run of runs){ s+=`/F1 ${NOTE_SIZE} Tf (${encStr(run.text)}) Tj\n`; }
        s+="ET\n";
        yy-=BODY_LEAD;
      }
    }
    objects[contObjNum(i)]={stream:s};
  }

  // Übersichts-Seiten anhängen (Content-Streams nutzen /F1 und /F2, die oben definiert sind)
  for(let k=0;k<ovStreams.length;k++){
    const i=nPages+k;
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    objects[contObjNum(i)]={stream:ovStreams[k]+"\n"};
  }

  let pdf="%PDF-1.7\n%\u00E2\u00E3\u00CF\u00D3\n";
  if(opts.trackB64) pdf+=`%TRACKDATA ${opts.trackB64}\n`;
  const offsets={}; const maxNum=6+nAll*2;
  for(let n=1;n<=maxNum;n++){
    offsets[n]=pdf.length; const o=objects[n];
    if(o&&o.stream!==undefined){const st=o.stream;pdf+=`${n} 0 obj\n<< /Length ${st.length} >>\nstream\n${st}endstream\nendobj\n`;}
    else pdf+=`${n} 0 obj\n${o}\nendobj\n`;
  }
  const xrefStart=pdf.length;
  pdf+=`xref\n0 ${maxNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxNum;n++) pdf+=String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  pdf+=`trailer\n<< /Size ${maxNum+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* ---------------- gemeinsame Krypto- & Auswertungs-Funktionen ---------------- *
 * Diese werden per toString() in die Lehrkraft-Seite (data:-Link) eingebettet,  *
 * damit es nur EINE Quelle der Wahrheit gibt.                                   */
function bytesToB64(bytes){let bin="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function _key(codeStr,usage){const mat=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(codeStr));return crypto.subtle.importKey("raw",mat,{name:"AES-GCM"},false,usage);}
async function aesEncrypt(plain,codeStr){const iv=crypto.getRandomValues(new Uint8Array(12));const key=await _key(codeStr,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plain));return bytesToB64(iv)+":"+bytesToB64(new Uint8Array(ct));}
async function aesDecrypt(bundle,codeStr){const parts=bundle.split(":");const iv=b64ToBytes(parts[0]);const ct=b64ToBytes(parts[1]);const key=await _key(codeStr,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt);}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function classify(isVisible,src,gap){
  const COL={plain:"#23201b",paste:"#b3261e",fast:"#c2710c",slow:"#1f7a34",system:"#23201b"};
  if(src==="s") return COL.system;           // System-Text (vorbefüllte Aufgaben) -> schwarz wie normaler Text, nie farbig
  if(!isVisible) return COL.plain;
  if(src==="p") return COL.paste;            // aus Zwischenablage -> rot
  if(gap>=0&&gap<=15) return COL.paste;      // <= 0,015 s getippt -> rot
  if(gap>15&&gap<=70) return COL.fast;       // 0,015-0,07 s -> orange
  return COL.slow;                           // > 0,07 s / erstes Zeichen -> grün
}
const RED_LIMIT=50; // Rot-Anteil strikt ÜBER diesem Wert wird rot und fett hervorgehoben
/* Zählt sichtbare, nicht vorbefüllte Zeichen nach Farbe – EINE Formel für Einzelansicht, Export und Tabelle */
function computeStats(t,m){
  const WS=/\s/; let total=0,red=0,orange=0,green=0;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const col=classify(isV,mark[0],mark[1]);
    if(isV && mark[0]!=="s"){ total++;
      if(col==="#b3261e") red++;
      else if(col==="#c2710c") orange++;
      else green++;
    }
  }
  const pct=(x)=>total?Math.round(x/total*100):0;
  return {total,red,orange,green,redPct:pct(red),orangePct:pct(orange),greenPct:pct(green)};
}
function renderAnalysis(payload){
  const t=payload.t, m=payload.m||[], f=payload.f||[];
  let html="";
  const WS=/\s/;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const src=mark[0]; const gap=mark[1];
    const col=classify(isV,src,gap);
    const fl=f[i]||0; let st="color:"+col;
    if(fl&8){ st+=";font-weight:700;font-size:1.6em"; } else if(fl&1){ st+=";font-weight:700"; }
    if(fl&2) st+=";font-style:italic";
    if(fl&4) st+=";text-decoration:underline";
    html+=`<span style="${st}">${esc(ch)}</span>`;
  }
  const s=computeStats(t,m);
  // gespeicherter Rot-Anteil aus der PDF; ältere PDFs ohne Wert: aus den Tracking-Daten berechnet
  const rp=(typeof payload.r==="number"&&isFinite(payload.r))?payload.r:s.redPct;
  const badge=`<div class="redbadge${rp>RED_LIMIT?" high":""}">Rot-Anteil: ${rp} %</div>`;
  const legend=
    '<div class="legend">'+
      '<span><i class="sw" style="background:#b3261e"></i>eingefügt oder ≤ 0,015 s getippt</span>'+
      '<span><i class="sw" style="background:#c2710c"></i>0,015–0,07 s nach vorherigem Zeichen getippt</span>'+
      '<span><i class="sw" style="background:#1f7a34"></i>&gt; 0,07 s nach vorherigem Zeichen getippt</span>'+
    '</div>';
  const stat=`<p class="stat">Zeichen gesamt: ${s.total} · rot: ${s.red} (${s.redPct} %) · orange: ${s.orange} (${s.orangePct} %) · grün: ${s.green} (${s.greenPct} %)</p>`;
  const head=`<div class="nmeta">Verfasser:in — ${esc(payload.n||"")}</div>`;
  return head+badge+legend+stat+`<div class="analysis">${html}</div>`;
}

/* ----------------------- geheime Code-Bildung (Lehrkraft) ----------------------- */
function _kfN(n){return String(n*(0x230+0x220));}          // Code aus Buchstabenzahl
function _kf(s){const n=(s.match(/\p{L}/gu)||[]).length;return _kfN(n);}

/* ------------------------------ Tracking ------------------------------ */
let prevValue="";
let recs=[];          // pro Zeichen: {src:'t'|'p', t:ms}
let justPasted=false; // wird durch paste/drop gesetzt, nach einem input-Event geleert

function reconcile(newVal,pasted,now){
  const a=prevValue,b=newVal; const minL=Math.min(a.length,b.length);
  let p=0; while(p<minL&&a[p]===b[p])p++;
  let s=0; while(s<minL-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const removed=a.length-p-s;
  const inserted=b.slice(p,b.length-s);
  const ins=inserted.split("").map(()=>({src:pasted?"p":"t",t:now}));
  recs.splice(p,removed,...ins);
  if(recs.length!==b.length){ // Sicherheitsnetz gegen Desync: Tipp-Info unbekannt (t=-1), nie fälschlich rot
    recs=b.split("").map(()=>({src:"t",t:-1}));
  }
  prevValue=newVal;
}

let systemSnippets=[]; // vorgeschriebene Textbausteine (Aufgabenlabels + Aufgabentexte) – immer System-Text
function markSystemByContent(text,m){
  // Markiert jedes Vorkommen eines vorgeschriebenen Bausteins als System ("s"), unabhängig vom
  // Tracking-Zustand. So werden Aufgabenstellungen nie farbig (rot/orange/grün) ausgewertet.
  for(const snip of systemSnippets){
    if(!snip) continue;
    let from=0, idx;
    while((idx=text.indexOf(snip,from))!==-1){
      for(let i=idx;i<idx+snip.length;i++){ if(m[i]) m[i][0]="s"; }
      from=idx+snip.length;
    }
  }
}
function buildPayload(name,text,fmt,vn,nn){
  if(recs.length!==text.length){ // letzte Absicherung: Tipp-Info verloren -> Abstand unbekannt (nie fälschlich rot)
    recs=text.split("").map(()=>({src:"t",t:-1}));
  }
  fmt=fmt||[];
  const m=[]; const f=[];
  for(let i=0;i<text.length;i++){
    const gap=(i===0||recs[i].t<0||recs[i-1].t<0)?-1:(recs[i].t-recs[i-1].t);
    m.push([recs[i].src,gap]);
    const ft=fmt[i]||{};
    let bits=0; if(ft.b)bits|=1; if(ft.i)bits|=2; if(ft.u)bits|=4; if(ft.h)bits|=8;
    f.push(bits);
  }
  markSystemByContent(text,m);   // vorgeschriebene Aufgaben: immer System, nie farbig
  const r=computeStats(text,m).redPct; // Rot-Anteil in Prozent, wie ihn die Lehrkraft-Ansicht zeigt
  return {n:name,t:text,m,f,vn:vn||"",nn:nn||"",r};
}

function sanitize(s){return (s||"").replace(/[^\p{L}\p{N}_-]/gu,"_").slice(0,40)||"Datei";}
function asciiName(s){
  return (s||"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9_-]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")
    .slice(0,40) || "Datei";
}
function fileSafe(s){return (s||"").replace(/[\/\\:*?"<>|\u0000-\u001f]/g,"").replace(/\s+/g," ").trim().slice(0,90)||"Datei";}
function downloadBlob(blob,filename){

/* ---------- Escape-Room-Modus: aus hochgeladener Überblick-PDF rekonstruieren ---------- */
function buildPrefill(tasks){
  const lines=[];
  tasks.forEach((task,i)=>{
    lines.push("Aufgabe "+(i+1));
    lines.push(task);
    for(let k=0;k<8;k++) lines.push("");   // 8 Leerzeilen Lösungsraum
  });
  return lines.join("\n");
}
function startEscapeMode(v,n,tasks,red){
  studentVorname=(v||"").trim(); studentNachname=(n||"").trim();
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  escapeRed=Array.isArray(red)?red:[];
  // Vorgeschriebene Bausteine merken: Aufgabenlabels + Aufgabentexte -> beim Export immer System-Text
  systemSnippets=[];
  if(Array.isArray(tasks)) tasks.forEach((task,i)=>{ systemSnippets.push("Aufgabe "+(i+1)); if(task) systemSnippets.push(String(task)); });
  const prefill=(Array.isArray(tasks)&&tasks.length)?buildPrefill(tasks):"";
  const now=Date.now();
  setEditorText(prefill); prevValue=prefill;
  recs=prefill.split("").map(()=>({src:"s",t:now}));   // vorbefüllter Text = System (grau, nicht gezählt)
  renderMoodleHints();
  updateCharcount();
  show("screen-editor");
  setTimeout(()=>{
    ed.focus();
    // Cursor in die erste leere Lösungszeile setzen
    const pf=prefill.split("\n");
    let bi=pf.indexOf(""); if(bi<0) bi=pf.length-1;
    const blocks=Array.prototype.filter.call(ed.childNodes,n=>n.nodeType===1);
    placeCaretAtBlockStart(blocks[bi]||blocks[blocks.length-1]);
  },50);
}
function readEscapePdf(file){
  $("esc-err").textContent="";
  const fr=new FileReader();
  fr.onload=()=>{
    const bytes=new Uint8Array(fr.result);
    let str=""; for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);
    const mm=str.match(/%ESCAPEDATA (\S+)/);
    if(!mm){$("esc-err").textContent="In dieser PDF wurden keine Escape-Room-Daten gefunden. Bitte lade die Überblick-PDF aus dem Escape-Room hoch.";return;}
    let d;
    try{ d=JSON.parse(decodeURIComponent(escape(atob(mm[1])))); }
    catch(e){ $("esc-err").textContent="Die Escape-Room-Daten konnten nicht gelesen werden."; return; }
    startEscapeMode(d.v,d.n,d.t,d.r);
  };
  fr.onerror=()=>{$("esc-err").textContent="Datei konnte nicht gelesen werden.";};
  fr.readAsArrayBuffer(file);
}

/* ---------- Rich-Text-Editor: Serialisierung & Formatierung ---------- */
/* Read-only: liest den contenteditable-Inhalt als {text, fmt} aus, OHNE das DOM
   oder den Cursor zu verändern. Inline-Formatierung ändert den Text nicht, nur fmt –
   dadurch bleiben die Tipp-Tempo-Daten (recs) über Formatierungen hinweg erhalten. */
function serializeEditor(){
  const root=$("editor");
  const chars=[]; const fmt=[];
  function isBlock(node){ return node.nodeType===1 && /^(DIV|P|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(node.tagName); }
  function lastIsNL(){ return chars.length===0 || chars[chars.length-1]==="\n"; }
  function pushCh(ch,st){ chars.push(ch); fmt.push({b:st.b,i:st.i,u:st.u,h:st.h}); }
  function lastChildOfBlock(node){
    const p=node.parentNode; return p && isBlock(p) && p.childNodes[p.childNodes.length-1]===node;
  }
  function walk(node, st){
    const kids=node.childNodes||[];
    for(let k=0;k<kids.length;k++){
      const child=kids[k];
      if(child.nodeType===3){
        const s=child.nodeValue||"";
        for(const ch of s) pushCh(ch, st);
      } else if(child.nodeType===1){
        const tag=child.tagName;
        if(tag==="BR"){
          if(lastChildOfBlock(child)){ /* Platzhalter-<br> -> kein Umbruch */ }
          else pushCh("\n", st);
          continue;
        }
        const ns={b:st.b,i:st.i,u:st.u,h:st.h};
        if(tag==="B"||tag==="STRONG") ns.b=true;
        if(tag==="I"||tag==="EM") ns.i=true;
        if(tag==="U"||tag==="INS") ns.u=true;
        const sty=child.style||{};
        const fw=sty.fontWeight; if(fw==="bold"||fw==="bolder"||(fw&&parseInt(fw,10)>=600)) ns.b=true;
        const fst=sty.fontStyle; if(fst&&String(fst).indexOf("italic")>=0) ns.i=true;
        const td=(sty.textDecorationLine||sty.textDecoration||""); if(String(td).indexOf("underline")>=0) ns.u=true;
        if(child.classList&&child.classList.contains("heading")){ ns.h=true; ns.b=true; }
        if(/^H[1-6]$/.test(tag)){ ns.h=true; ns.b=true; }
        try{ const cs=getComputedStyle(child); if(cs){ const w=cs.fontWeight; if(w==="bold"||w==="bolder"||(parseInt(w,10)>=600)) ns.b=true; if(String(cs.fontStyle||"").indexOf("italic")>=0) ns.i=true; } }catch(e){}
        if(isBlock(child) && !lastIsNL()) pushCh("\n", st);
        walk(child, ns);
      }
    }
  }
  walk(root, {b:false,i:false,u:false,h:false});
  return { text: chars.join(""), fmt };
}

/* Baut den Editor-Inhalt aus reinem Text neu auf (jede Zeile = ein Block-DIV). */
function setEditorText(plain){
  const root=$("editor"); root.innerHTML="";
  const lines=String(plain||"").split("\n");
  for(const line of lines){
    const div=document.createElement("div");
    if(line==="") div.appendChild(document.createElement("br"));
    else div.appendChild(document.createTextNode(line));
    root.appendChild(div);
  }
  if(root.childNodes.length===0){ const d=document.createElement("div"); d.appendChild(document.createElement("br")); root.appendChild(d); }
  updateEmpty();
}

/* Platzhalter ein-/ausblenden (CSS: #editor.empty::before) */
function updateEmpty(){
  const root=$("editor");
  root.classList.toggle("empty", serializeEditor().text.length===0);
}

/* Den Block (oberste DIV-Ebene im Editor), in dem ein Knoten liegt. */
function blockOf(node){
  const root=$("editor"); if(!node) return null;
  if(node===root){ return null; }
  let n=node;
  while(n && n.parentNode!==root) n=n.parentNode;
  return (n && n.parentNode===root && n.nodeType===1) ? n : null;
}
/* Alle Blöcke, die von der aktuellen Auswahl berührt werden. */
function selectedBlocks(){
  const root=$("editor"); const sel=window.getSelection();
  if(!sel||sel.rangeCount===0) return [];
  const r=sel.getRangeAt(0);
  let a=blockOf(r.startContainer), b=blockOf(r.endContainer);
  const blocks=Array.prototype.filter.call(root.childNodes,n=>n.nodeType===1);
  if(!a) a=blocks[0]; if(!b) b=blocks[blocks.length-1];
  if(!a||!b) return [];
  const ia=blocks.indexOf(a), ib=blocks.indexOf(b);
  if(ia<0||ib<0) return [];
  const lo=Math.min(ia,ib), hi=Math.max(ia,ib);
  return blocks.slice(lo,hi+1);
}
/* Überschrift für die ausgewählten Blöcke umschalten. */
function toggleHeading(){
  const blocks=selectedBlocks(); if(!blocks.length) return;
  const allHead=blocks.every(b=>b.classList.contains("heading"));
  blocks.forEach(b=>{ if(allHead) b.classList.remove("heading"); else b.classList.add("heading"); });
  $("editor").focus();
  updateFormatButtons();
}
/* Button-Zustände an die aktuelle Auswahl/Cursorposition anpassen. */
function updateFormatButtons(){
  const q=(c)=>{ try{ return document.queryCommandState(c); }catch(e){ return false; } };
  $("fb-bold").classList.toggle("active", q("bold"));
  $("fb-italic").classList.toggle("active", q("italic"));
  $("fb-underline").classList.toggle("active", q("underline"));
  const blocks=selectedBlocks();
  const head = blocks.length>0 && blocks.every(b=>b.classList.contains("heading"));
  $("fb-heading").classList.toggle("active", head);
}
/* Inline-Befehl (bold/italic/underline) ausführen; Auswahl bleibt erhalten. */
function execInline(cmd){
  $("editor").focus();
  try{ document.execCommand(cmd,false,null); }catch(e){}
  updateFormatButtons();
  updateEmpty();
}
/* Cursor an den Anfang eines Blocks setzen. */
function placeCaretAtBlockStart(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  r.setStart(block,0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}

/* Lehrkraft: PDF laden + Code (Einzelansicht) bzw. mehrere PDFs (Tabellenansicht) */
let teacherBundle=null;
let batchRows=[];        // Zeilen der Tabellenansicht
let batchSelected=null;  // in der Tabelle angeklickte Zeile
const TRACK_RE=/%TRACKDATA (\S+)/;

function readAsBinaryStr(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const u=new Uint8Array(fr.result);let s="";const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));res(s);};
    fr.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden."));
    fr.readAsArrayBuffer(file);
  });
}
function setCodeFor(text){
  const el=$("code-for"); if(!el) return;
  el.textContent=text?("Einzelansicht für "+text+" – bitte Code eingeben."):"";
  el.classList.toggle("hidden",!text);
}
function resetTeacherView(){
  $("teacher-err").textContent=""; $("result").innerHTML="";
  $("code-area").classList.add("hidden"); $("code-input").value="";
  setCodeFor(""); teacherBundle=null; batchRows=[]; batchSelected=null;
}

/* Einzelansicht: eine PDF, Code wird von der Lehrkraft eingegeben */
async function readPdfFile(file){
  resetTeacherView();
  try{
    const str=await readAsBinaryStr(file);
    const mm=str.match(TRACK_RE);
    if(!mm){$("teacher-err").textContent="In dieser PDF wurden keine Tracking-Daten gefunden.";return;}
    teacherBundle=mm[1];
    $("code-area").classList.remove("hidden");
    setTimeout(()=>$("code-input").focus(),40);
  }catch(err){ $("teacher-err").textContent=err.message||"Datei konnte nicht gelesen werden."; }
}

/* Code automatisch ermitteln: alle plausiblen Buchstabenzahlen des Vornamens durchprobieren
   (AES-GCM schlägt bei falschem Code sauber fehl) */
async function autoDecrypt(bundle){
  for(let n=1;n<=40;n++){
    const code=_kfN(n);
    try{ const json=await aesDecrypt(bundle,code); return {payload:JSON.parse(json),code}; }catch(e){}
  }
  throw new Error("Code konnte nicht ermittelt werden.");
}
function splitName(p){
  let vn=(p.vn||"").trim(), nn=(p.nn||"").trim();
  if(!vn&&!nn){ // ältere PDFs: nur Gesamtname gespeichert -> am ersten Leerzeichen teilen
    const n=(p.n||"").trim(); const i=n.indexOf(" ");
    if(i<0) vn=n; else { vn=n.slice(0,i); nn=n.slice(i+1).trim(); }
  }
  return {vn,nn};
}
function redPercent(p){ return (typeof p.r==="number"&&isFinite(p.r))?p.r:computeStats(p.t||"",p.m||[]).redPct; }

/* Tabellenansicht: mehrere PDFs */
async function readBatch(files){
  resetTeacherView();
  $("result").innerHTML=`<p class="batchsum">Werte ${files.length} PDF-Dateien aus…</p>`;
  const rows=[];
  for(const f of files){
    try{
      const str=await readAsBinaryStr(f);
      const mm=str.match(TRACK_RE);
      if(!mm) throw new Error("keine Tracking-Daten gefunden");
      const {payload}=await autoDecrypt(mm[1]);
      const nm=splitName(payload);
      rows.push({file:f.name,vn:nm.vn,nn:nm.nn,r:redPercent(payload),bundle:mm[1]});
    }catch(err){ rows.push({file:f.name,error:err.message||"Fehler"}); }
  }
  batchRows=rows;
  renderBatchTable();
}
function renderBatchTable(){
  const rows=batchRows.slice();
  rows.sort((a,b)=>{
    if(!!a.error!==!!b.error) return a.error?1:-1;            // Fehlerzeilen ans Ende
    if(!a.error && b.r!==a.r) return b.r-a.r;                  // Rot-Anteil absteigend
    const c=(a.nn||"").localeCompare(b.nn||"","de"); if(c) return c;
    return (a.vn||"").localeCompare(b.vn||"","de");
  });
  const ok=rows.filter(r=>!r.error), high=ok.filter(r=>r.r>RED_LIMIT).length, errs=rows.length-ok.length;
  let html=`<p class="batchsum">${rows.length} PDF-Dateien · ${high} über ${RED_LIMIT} %${errs?` · ${errs} nicht lesbar`:""}</p>`;
  html+='<div class="tablewrap"><table class="batch"><thead><tr><th>Vorname</th><th>Nachname</th><th class="pct">Rot-Anteil</th></tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.error){ html+=`<tr class="errrow"><td colspan="3">${esc(r.file)} – ${esc(r.error)}</td></tr>`; return; }
    const hi=r.r>RED_LIMIT;
    html+=`<tr class="clickable" data-idx="${batchRows.indexOf(r)}" title="Einzelansicht öffnen (Code erforderlich)"><td>${esc(r.vn)}</td><td>${esc(r.nn)}</td><td class="pct${hi?" high":""}">${r.r}&nbsp;%</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+='<p class="batchhint">Rot-Anteil = Anteil der rot markierten Zeichen (eingefügt oder ≤ 0,015 s getippt). Klick auf eine Zeile öffnet die Einzelansicht nach Eingabe des Codes.</p>';
  $("result").innerHTML=html;
  $("code-area").classList.add("hidden"); setCodeFor(""); $("teacher-err").textContent="";
  batchSelected=null; teacherBundle=null;
  $("result").querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>selectBatchRow(parseInt(tr.dataset.idx,10),tr)));
}
function selectBatchRow(idx,tr){
  const row=batchRows[idx]; if(!row||row.error) return;
  batchSelected=row; teacherBundle=row.bundle;
  $("result").querySelectorAll("tr.selected").forEach(x=>x.classList.remove("selected"));
  tr.classList.add("selected");
  setCodeFor((row.vn+" "+row.nn).trim());
  $("teacher-err").textContent="";
  $("code-area").classList.remove("hidden"); $("code-input").value="";
  try{ $("code-area").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  setTimeout(()=>$("code-input").focus(),40);
}

function handleFiles(list){
  const files=Array.prototype.slice.call(list||[]);
  if(!files.length) return;
  if(files.length===1) readPdfFile(files[0]); else readBatch(files);
}
$("pdf-input").addEventListener("change",e=>{handleFiles(e.target.files); e.target.value="";});
const dropZone=$("teacher-drop");
["dragover","dragenter"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="#8a6a3c";}));
["dragleave","drop"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="";}));
dropZone.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files);});

async function showTeacherResult(){
  const code=$("code-input").value.trim();
  $("teacher-err").textContent="";
  if(!teacherBundle)return;
  try{
    const json=await aesDecrypt(teacherBundle,code);
    const p=JSON.parse(json);
    let html=renderAnalysis(p);
    if(batchSelected) html='<a href="#" class="backlink" id="back-table">← zurück zur Tabelle</a>'+html;
    $("result").innerHTML=html;
    if(batchSelected){
      $("code-area").classList.add("hidden"); setCodeFor("");
      $("back-table").addEventListener("click",e=>{e.preventDefault();renderBatchTable();});
    }
  }catch(err){
    if(!batchSelected) $("result").innerHTML="";   // in der Tabellenansicht bleibt die Tabelle stehen
    $("teacher-err").textContent="Falscher Code.";
  }
}
$("code-btn").addEventListener("click",showTeacherResult);
$("code-input").addEventListener("keydown",e=>{if(e.key==="Enter")showTeacherResult();});

  line(x1,y1,x2,y2,color,width){
    const c=color||[0,0,0];
    this.currentContent.push(`${c[0]/255} ${c[1]/255} ${c[2]/255} RG\n${width||0.5} w\n${x1} ${y1} m ${x2} ${y2} l S`);
  }
  paragraph(str,x,y,width,fontSize,isBold,color,leading){
    if(!leading) leading=fontSize*1.4;
    const words=String(str).split(/\s+/); let line=''; let curY=y;
    for(const word of words){
      if(!word) continue;
      const test=line?line+' '+word:word;
      if(pdfStringWidth(test,fontSize,isBold)<=width){ line=test; }
      else{
        if(line){ this.text(line,x,curY,fontSize,isBold,color); curY-=leading; line=word; }
        else{ this.text(word,x,curY,fontSize,isBold,color); curY-=leading; }
      }
    }
    if(line){ this.text(line,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  build(){
    const objects=[null,null,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const pageIds=[];
    for(const page of this.pages){
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId=objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0]='<< /Type /Catalog /Pages 2 0 R >>';
    let pdf='%PDF-1.4\n%\xC4\xC5\xC6\xC7\n'; const offsets=[0];
    for(let i=0;i<objects.length;i++){ offsets.push(pdf.length); pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`; }
    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  toBase64(trailerComment){
    let pdf=this.build();
    if(trailerComment) pdf+=trailerComment;   // unsichtbar nach %%EOF (von PDF-Viewern ignoriert)
    return btoa(pdf);
  }
}

/* ============================================================
   DOWNLOAD-HELFER
   ============================================================ */
function translit(s){
  return (s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/[^a-zA-Z0-9-]/g,'');
}
function downloadPdfBase64(b64,filename){
  const binary=atob(b64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a'); link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
window.downloadOverviewPDF=()=>{
  try{
    const b64=generateOverviewPdf();
    const clean=(s)=>(s||'').trim().replace(/\s+/g,'-').replace(/[\/\\:*?"<>|]+/g,'');
    const vn=clean(state.firstName)||'Vorname';
    const nn=clean(state.lastName)||'Nachname';
    const filename=`Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary=atob(b64); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    // Als generischer Binärstrom (octet-stream) statt application/pdf: So kann kein Browser die Datei
    // inline anzeigen – auch Firefox/Chrome mit „PDF im Browser öffnen" müssen sie speichern. Der Name
    // (.pdf) kommt über das download-Attribut; die Datei selbst ist eine ganz normale PDF.
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.rel='noopener'; link.style.display='none';
    document.body.appendChild(link);
    link.click();   // synchron im Klick-Handler -> gilt als vom Nutzer ausgelöst
    // Link und Object-URL erst verzögert entfernen: manche Browser brechen den Download sonst ab
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(e){} URL.revokeObjectURL(url); },5000);
  }catch(e){ console.error(e); alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: '+e.message); }
};
window.downloadReflexionPDF=()=>{
  try{
    const b64=generateReflexionPdf();
    const name=translit(state.lastName)||'Schueler';
    downloadPdfBase64(b64,`Reflexion_${name}_${state.code}.pdf`);
  }catch(e){ console.error(e); alert('Konnte die Datei nicht erzeugen: '+e.message); }
};
window.openFeiditor=()=>{
  try{
    const tplEl=document.getElementById('feiditor-src');
    if(!tplEl){ alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html=tplEl.textContent.replace(/<\\\/script>/gi,'<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data={
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0,6),
      redFields: RED_FIELDS,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      'Politik & Wirtschaft · Konsum unter der Lupe · Escape-Room „Der Sneaker vor der Haustür"'
      }
    };
    const inject='<script>window.__ESCAPE_DATA__='+JSON.stringify(data).replace(/</g,'\\u003c')+';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if(html.indexOf('<head>')!==-1) html=html.replace('<head>', '<head>\n'+inject);
    else html=inject+html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    const win=window.open('','_blank');
    if(!win){ alert('Bitte erlaube Pop-ups für diese Seite, damit sich das digitale Arbeitsblatt öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){ console.error(e); alert('Das digitale Arbeitsblatt konnte nicht geöffnet werden: '+e.message); }
};

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

}

window.maskBirth=(el)=>{
  let v=el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out=v;
  if(v.length>4) out=v.slice(0,2)+'.'+v.slice(2,4)+'.'+v.slice(4);
  else if(v.length>2) out=v.slice(0,2)+'.'+v.slice(2);
  el.value=out;
};
window.submitStart=()=>{
  const fn=document.getElementById('firstNameInput').value.trim();
  const ln=document.getElementById('lastNameInput').value.trim();
  const bd=document.getElementById('birthInput').value.trim();
  const err=document.getElementById('startError');
  function showErr(msg){ err.style.display='block'; err.textContent=msg; }
  if(fn.length<2||ln.length<2){ showErr('Bitte trag deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).'); return; }
  const m=bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(!m){ showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2013).'); return; }
  const dd=parseInt(m[1],10), mm=parseInt(m[2],10), yyyy=parseInt(m[3],10);
  if(dd<1||dd>31||mm<1||mm>12||yyyy<1900||yyyy>2025){ showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.'); return; }
  state.firstName=fn; state.lastName=ln; state.birthDate=bd;
  const digits=m[1]+m[2]+m[3];
  state.code=computeCode(digits);
  renderIntro();
};

            <text x="260" y="318" text-anchor="middle" fill="#1e2a1f" font-family="Inter,sans-serif" font-size="11" font-weight="600">LKW</text>
            <text x="370" y="318" text-anchor="middle" fill="#1e2a1f" font-family="Inter,sans-serif" font-size="11" font-weight="600">Frachtflugzeug</text>
          </svg>
          <div class="chart-caption">Vergleichswerte für den Güterverkehr; Bandbreiten je nach Schiffsgröße und Auslastung.<br>Quellen: NABU, Umweltbundesamt, Hafen Hamburg, IMO</div>
        </div>
        <p>Was du sofort siehst: Das <strong>Frachtflugzeug</strong> ist eine ganz andere Liga. Pro Kilogramm Ware stößt es rund <strong>60-mal mehr CO₂</strong> aus als ein Containerschiff und etwa 10-mal so viel wie ein LKW. Der Grund dafür: Schiffe transportieren riesige Mengen gleichzeitig. Verteilt man die Klimabelastung auf jedes einzelne Kilogramm Ware, wird sie sehr klein.</p>
      </div>

      <div class="lib-section">
        <div class="lib-section-title">Aber: Schiffe sind nicht so „sauber", wie sie wirken</div>
        <p>Beim CO₂ schneidet das Containerschiff pro Kilogramm super ab – beim Rest leider nicht. Schiffe verbrennen meistens <strong>Schweröl</strong>, einen besonders billigen und schmutzigen Treibstoff. Dadurch stoßen sie sehr viel von folgenden Luftschadstoffen aus:</p>
        <div class="pollutants-grid">
          <div class="pollutant-card">
            <div class="pc-name">Schwefeldioxid (SO₂)</div>
            <div class="pc-body">Reizt Atemwege und Lunge, lässt sauren Regen entstehen, der Wälder und Seen schädigt.</div>
          </div>
          <div class="pollutant-card">
            <div class="pc-name">Stickoxide (NOₓ)</div>
            <div class="pc-body">Schädigen ebenfalls die Atemwege und tragen zu Smog und Ozonbildung bei.</div>
          </div>
          <div class="pollutant-card">
            <div class="pc-name">Feinstaub</div>

          </div>
        </div>
        <p style="margin-top:14px;">Eine Zahl zum Vergleich: Im Schiffstreibstoff darf der Schwefel-Anteil bis zu <strong>3,5 Prozent</strong> betragen. Beim Diesel, den LKWs tanken, sind es nur <strong>0,001 Prozent</strong>. Das ist ungefähr <strong>3.500-mal weniger</strong> – Schiffstreibstoff ist also <em>extrem</em> viel schmutziger als das, was bei uns an der Tankstelle verkauft wird.</p>
      </div>

      <div class="lib-section">
        <div class="lib-section-title">Das große Bild</div>
        <p>Insgesamt ist die weltweite Schifffahrt für rund <strong>3 Prozent</strong> aller von Menschen verursachten CO₂-Emissionen verantwortlich. Das klingt nach wenig – aber das sind jedes Jahr etwa <strong>1 Milliarde Tonnen CO₂</strong>. Damit verursacht die Schifffahrt insgesamt mehr CO₂ als ganz Deutschland in einem Jahr.</p>
      </div>

      <div class="note-box">
        <span class="note-label">Differenzierte Faustregel</span>
        Pro Kilogramm Ware schneidet das Containerschiff am besten ab – das stimmt. ABER: kein Transportmittel ist „sauber". Lange Lieferwege bedeuten immer auch Luftverschmutzung. Am umweltfreundlichsten ist deshalb immer: <strong>weniger und kürzer transportieren</strong>.
      </div>`,

    content:`
      <div class="lib-section">

        <p>Ein typischer Sneaker hat ziemlich viele Bestandteile:</p>

        <p>Beim Anbau werden außerdem riesige Mengen an Giftstoffen gegen Schädlinge eingesetzt. Diese Giftstoffe heißen <strong>Pestizide</strong>. Baumwolle wächst auf nur ca. 2,5 % der weltweiten Ackerfläche – verbraucht aber rund ein Viertel aller weltweit eingesetzten Insektizide.</p>

        <p>In Zentralasien lag einmal der <strong>Aralsee</strong>. Vor 60 Jahren war er der <strong>viertgrößte See der Welt</strong>. Heute ist davon nur noch ein Bruchteil übrig – der See ist auf rund <strong>10 Prozent</strong> seiner ursprünglichen Größe geschrumpft.</p>
        <p>Warum? Die Sowjetunion (das Land, das damals diese Region regierte) hat in den 1960er-Jahren begonnen, das Wasser der Flüsse, die den See speisten, für riesige <strong>Baumwollfelder</strong> umzuleiten. Heute liegen dort, wo früher Wasser war, nur noch staubige Wüsten und rostige Schiffe. Fachleute nennen den geschrumpften Aralsee eine der schlimmsten von Menschen verursachten Umweltkatastrophen.</p>

        <div class="lib-section-title">Der Aralsee als Mahnmal — eine Reportage</div>
        <p>Was bedeutet das ganz konkret für die Menschen, die heute noch dort leben? Welche Folgen hat das verschwundene Wasser für Gesundheit und Lebensgrundlage? Schau dir die folgende Weltspiegel-Reportage an.</p>

function renderLibrary(idx){
  state.screen='lib'+(idx+1); renderSeals();
  window.scrollTo({top:0,behavior:'instant'});
  const lib=LIBRARIES[idx];
  root.innerHTML=`
    ${libraryBanner()}
    <div class="room-header">
      <div class="room-number" style="color:var(--primary);">A${idx+1}</div>
      <div class="room-meta"><div class="room-location">${lib.location}</div><div class="room-name">${lib.name}</div></div>
    </div>
    <p class="lede" style="margin-bottom:24px;">${lib.intro}</p>
    ${lib.content}
    ${libraryWarningBar()}
    <div class="btn-row"><button class="btn btn-primary btn-arrow" onclick="goRoom(${idx+1})">Zur ${lib.target}</button></div>
  `;
}

function triggerReveal(roomIdx){
  state.solved[roomIdx]=true; state.letters[roomIdx]=CODE_WORD[roomIdx];

  document.getElementById('revealLetter').textContent=CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent=`Buchstabe ${roomIdx+1} von 6 freigeschaltet`;
  const progBox=document.getElementById('revealProgress'); progBox.innerHTML='';
  for(let i=0;i<6;i++){ const span=document.createElement('span'); span.className='reveal-progress-letter'+(state.solved[i]?' lit':''); span.textContent=state.solved[i]?CODE_WORD[i]:'·'; progBox.appendChild(span); }
  const btn=document.getElementById('revealContinue'); const isLast=roomIdx===5;
  btn.textContent=isLast?'Fall abschließen':'Nächste Recherche-Akte öffnen';
  btn.onclick=()=>{ overlay.classList.remove('show'); setTimeout(()=>{ if(isLast) renderFinal(); else goLibrary(roomIdx+2); },250); };
  overlay.classList.add('show');
}
